name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Check user-facing errors
        run: npm run check:errors

      # Pins the client-reported copy and layout fixes. Most of their unit tests are
      # untracked, so without this the pipeline would not notice a revert.
      - name: Check client-reported UX fixes
        run: npm run check:ux

      - name: Lint
        run: npm run lint
      # A test that was never committed protects one laptop. 10 of this repo's 14
      # test files had never been `git add`ed, so CI ran 4 of them while the suite
      # looked complete.
      - name: Check tests are committed
        run: npm run check:tests

      - name: Unit tests
        run: npm test
